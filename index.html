<title>理膚寶水親友員購價</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* ── Design tokens ── */
:root {
  --bg:        #F5F8FC;
  --surface:   #FFFFFF;
  --surface-2: #EDF4FB;
  --blue:      #0060A8;
  --blue-dk:   #003F7A;
  --blue-lt:   #E6F1FA;
  --teal:      #007A80;
  --teal-lt:   #E2F4F5;
  --text-1:    #12213A;
  --text-2:    #4B5D72;
  --text-3:    #8A9BAD;
  --border:    #C9DDED;
  --red:       #C0392B;
  --badge-bg:  #FEF6E0;
  --badge-txt: #8A5A00;
  --new-bg:    #E8F8F0;
  --new-txt:   #1A6B44;
  --shadow:    0 2px 12px rgba(0,60,120,.08);
  --radius:    10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0D1520;
    --surface:   #162032;
    --surface-2: #1C2B40;
    --blue:      #4D9FE0;
    --blue-dk:   #6FB5EE;
    --blue-lt:   #162540;
    --teal:      #3FBEC4;
    --teal-lt:   #0D2A2D;
    --text-1:    #E4EDF8;
    --text-2:    #8BA8C6;
    --text-3:    #4E6882;
    --border:    #253B55;
    --red:       #E06666;
    --badge-bg:  #2A2010;
    --badge-txt: #E0B060;
    --new-bg:    #0D2518;
    --new-txt:   #5ECFA0;
  }
}
:root[data-theme="dark"] {
  --bg:        #0D1520;
  --surface:   #162032;
  --surface-2: #1C2B40;
  --blue:      #4D9FE0;
  --blue-dk:   #6FB5EE;
  --blue-lt:   #162540;
  --teal:      #3FBEC4;
  --teal-lt:   #0D2A2D;
  --text-1:    #E4EDF8;
  --text-2:    #8BA8C6;
  --text-3:    #4E6882;
  --border:    #253B55;
  --red:       #E06666;
  --badge-bg:  #2A2010;
  --badge-txt: #E0B060;
  --new-bg:    #0D2518;
  --new-txt:   #5ECFA0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  font-size: 15px;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.site-header {
  background: var(--blue-dk);
  color: #fff;
  padding: 20px 20px 16px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,.3);
}
.header-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  max-width: 860px; margin: 0 auto;
}
.brand-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px; font-weight: 600;
  letter-spacing: .04em;
}
.brand-sub {
  font-size: 11px; opacity: .7; margin-top: 2px;
  letter-spacing: .12em; text-transform: uppercase;
}
.header-meta {
  text-align: right; font-size: 12px; opacity: .75; line-height: 1.7;
}
.header-meta strong { color: #FFD94D; font-size: 14px; }

/* cart badge */
.cart-btn {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: 20px; padding: 5px 12px;
  font-size: 13px; cursor: pointer; transition: background .15s;
}
.cart-btn:hover { background: rgba(255,255,255,.25); }
.cart-count {
  background: #FFD94D; color: #003F7A;
  font-size: 11px; font-weight: 700;
  border-radius: 50%; width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
}

/* ── Category tabs ── */
.cat-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 97px; z-index: 90;
}
.cat-nav-inner {
  display: flex; gap: 0;
  overflow-x: auto; scrollbar-width: none;
  max-width: 860px; margin: 0 auto;
}
.cat-nav-inner::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: 0 0 auto;
  padding: 10px 16px;
  font-size: 13px; font-weight: 500;
  color: var(--text-2);
  border-bottom: 3px solid transparent;
  cursor: pointer; transition: color .15s, border-color .15s;
  white-space: nowrap;
  background: none; border-left: none; border-right: none; border-top: none;
  font-family: inherit;
}
.cat-tab.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}
.cat-tab:hover:not(.active) { color: var(--text-1); }

/* ── Main content ── */
.main {
  max-width: 860px; margin: 0 auto;
  padding: 20px 12px 160px;
}

/* notice bar */
.notice {
  background: var(--blue-lt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px; color: var(--text-2);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}

/* ── Category section ── */
.cat-section { display: none; }
.cat-section.visible { display: block; }
.cat-heading {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px; font-weight: 600;
  color: var(--blue-dk);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px;
}

/* ── Product row ── */
.product-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: center;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.product-row:hover { background: var(--surface-2); border-radius: 6px; }
.product-row:last-child { border-bottom: none; }

.product-name {
  font-size: 14px; color: var(--text-1); line-height: 1.4;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: .05em;
  padding: 2px 6px; border-radius: 3px;
  flex: 0 0 auto;
}
.badge-dd  { background: var(--badge-bg); color: var(--badge-txt); }
.badge-new { background: var(--new-bg);   color: var(--new-txt);   }

.product-prices {
  font-size: 12px; color: var(--text-3); margin-top: 3px;
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
}
.price-retail { text-decoration: line-through; color: var(--text-3); }
.price-group  { color: var(--teal); font-size: 15px; font-weight: 700; }

.qty-control {
  display: flex; align-items: center; gap: 6px;
}
.qty-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text-1);
  font-size: 16px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
  font-family: inherit;
}
.qty-btn:hover { border-color: var(--blue); color: var(--blue); }
.qty-btn.minus:disabled { opacity: .3; cursor: default; }
.qty-num {
  width: 24px; text-align: center;
  font-size: 14px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--blue);
}

/* ── Sticky bottom bar ── */
.sticky-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 20px rgba(0,0,0,.12);
  padding: 12px 16px;
}
.sticky-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.sticky-totals { font-size: 13px; color: var(--text-2); }
.sticky-totals strong { font-size: 20px; color: var(--blue-dk); font-variant-numeric: tabular-nums; }
.sticky-sub { font-size: 11px; color: var(--teal); margin-top: 1px; }

.btn-primary {
  background: var(--blue); color: #fff;
  border: none; border-radius: 22px;
  padding: 10px 24px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .15s, transform .1s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--blue-dk); }
.btn-primary:active { transform: scale(.97); }
.btn-primary:disabled { opacity: .4; cursor: default; transform: none; }

/* ── Order form modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); width: 100%;
  border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto;
  padding: 24px 20px 40px;
  animation: slideUp .25s ease-out;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
.modal-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 20px;
}
.modal-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 19px; font-weight: 600; margin-bottom: 20px;
  color: var(--blue-dk);
}
.order-summary-box {
  background: var(--blue-lt); border-radius: var(--radius);
  padding: 14px; margin-bottom: 20px;
  max-height: 200px; overflow-y: auto;
}
.summary-row {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 13px; padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.summary-row:last-child { border: none; }
.summary-total {
  margin-top: 12px; padding-top: 12px;
  border-top: 2px solid var(--blue);
  display: flex; justify-content: space-between; align-items: center;
}
.summary-total-label { font-size: 14px; color: var(--text-2); }
.summary-total-amt { font-size: 22px; font-weight: 700; color: var(--blue-dk); font-variant-numeric: tabular-nums; }
.summary-savings { font-size: 12px; color: var(--teal); margin-top: 4px; text-align: right; }

/* form */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 12px; font-weight: 700;
  color: var(--text-2); letter-spacing: .06em;
  margin-bottom: 5px;
}
.form-input {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 15px;
  font-family: inherit; color: var(--text-1);
  background: var(--surface);
  transition: border-color .15s;
  outline: none;
}
.form-input:focus { border-color: var(--blue); }

.pay-options { display: flex; gap: 8px; flex-wrap: wrap; }
.pay-opt {
  flex: 1 1 auto; min-width: 100px;
  border: 1.5px solid var(--border);
  border-radius: 8px; padding: 10px 10px;
  text-align: center; cursor: pointer;
  font-size: 13px; color: var(--text-2);
  transition: border-color .15s, background .15s;
  font-family: inherit; background: var(--surface);
}
.pay-opt.selected {
  border-color: var(--blue); background: var(--blue-lt);
  color: var(--blue); font-weight: 700;
}

.form-note {
  font-size: 12px; color: var(--text-3); margin-top: 4px;
}

/* ── Confirmation ── */
.confirm-box {
  display: none;
  background: var(--teal-lt); border: 1px solid var(--teal);
  border-radius: var(--radius); padding: 20px;
  text-align: center;
}
.confirm-box.show { display: block; }
.confirm-icon { font-size: 36px; margin-bottom: 8px; }
.confirm-title { font-size: 18px; font-weight: 700; color: var(--teal); margin-bottom: 6px; }
.confirm-sub { font-size: 13px; color: var(--text-2); line-height: 1.6; }
.line-text-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-top: 14px;
  font-size: 12px; color: var(--text-1); white-space: pre-wrap;
  word-break: break-word; text-align: left; line-height: 1.7;
}
.copy-btn {
  background: none; border: 1.5px solid var(--teal);
  color: var(--teal); border-radius: 20px; padding: 7px 18px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  margin-top: 10px; font-family: inherit;
  transition: background .15s;
}
.copy-btn:hover { background: var(--teal-lt); }

/* close btn */
.close-btn {
  position: absolute; top: 20px; right: 20px;
  background: none; border: none; color: var(--text-3);
  font-size: 22px; cursor: pointer; line-height: 1;
  font-family: inherit;
}
.modal { position: relative; }

/* ── Toast ── */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
  background: var(--text-1); color: var(--surface);
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500;
  z-index: 9999; transition: transform .3s ease; white-space: nowrap;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }
.toast.ok    { background: var(--teal); }

/* ── Admin link ── */
.admin-link {
  text-align: center; padding: 24px 0 8px;
  font-size: 12px; color: var(--text-3);
}
.admin-link a {
  color: var(--text-3); text-decoration: none;
  border-bottom: 1px dashed var(--text-3);
}
.admin-link a:hover { color: var(--text-2); }

/* ── Admin password box ── */
.admin-pw-box {
  display: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
}
.admin-pw-box.show { display: block; }
.admin-pw-row { display: flex; gap: 8px; align-items: center; }
.admin-pw-err { font-size: 12px; color: var(--red); margin-top: 6px; display: none; }
.admin-pw-err.show { display: block; }

/* ── Admin panel ── */
.admin-panel { display: none; }
.admin-panel.open { display: block; }
.admin-header {
  background: var(--blue-dk); color: #fff;
  padding: 16px 20px; border-radius: var(--radius) var(--radius) 0 0;
  display: flex; align-items: center; justify-content: space-between;
}
.admin-header h2 { font-size: 16px; font-weight: 700; }
.order-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-bottom: 10px;
}
.order-card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.order-name { font-weight: 700; font-size: 15px; }
.order-amt { font-size: 18px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
.order-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.order-items { font-size: 13px; color: var(--text-2); line-height: 1.7; }

/* ── Inline confirm ── */
.inline-confirm {
  display: none; background: #FEF2F2; border: 1px solid var(--red);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  font-size: 13px; color: var(--red);
}
.inline-confirm.show { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.inline-confirm-btns { display: flex; gap: 6px; flex: 0 0 auto; }

@media (min-width: 600px) {
  .product-row { grid-template-columns: 1fr auto auto; }
  .site-header { padding: 20px 28px 16px; }
  .main { padding: 24px 20px 160px; }
}
</style>

<!-- Header -->
<header class="site-header">
  <div class="header-top">
    <div>
      <div class="brand-name">理膚寶水 La Roche-Posay</div>
      <div class="brand-sub">2026 年 09 月 親友員購價</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div class="header-meta">
        截止：<strong id="deadline-txt">9/15（二）23:59</strong>
      </div>
      <button class="cart-btn" onclick="openModal()">
        🛒 查看訂單
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<!-- Category tabs -->
<nav class="cat-nav">
  <div class="cat-nav-inner" id="cat-tabs"></div>
</nav>

<!-- Main -->
<main class="main" id="app">
<div class="notice">🚚 由台北公司出貨，運費由所有訂購者均攤，結單後通知運費金額</div>
<div id="cat-sections"></div>

  <div class="admin-link">
    <a href="#" onclick="toggleAdmin(); return false;">管理者後台</a>
  </div>

  <!-- Inline password box -->
  <div class="admin-pw-box" id="admin-pw-box">
    <div style="font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:10px">🔒 請輸入管理密碼</div>
    <div class="admin-pw-row">
      <input class="form-input" id="admin-pw-input" type="password" placeholder="密碼" style="flex:1"
        onkeydown="if(event.key==='Enter')checkAdminPw()" />
      <button class="btn-primary" style="padding:10px 18px;font-size:13px" onclick="checkAdminPw()">確認</button>
      <button onclick="closePwBox()" style="padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit">取消</button>
    </div>
    <div class="admin-pw-err" id="admin-pw-err">密碼錯誤，請再試一次</div>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="admin-header">
      <h2>📋 訂單總覽</h2>
      <span id="admin-total-txt" style="font-size:13px;opacity:.8"></span>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:14px">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn-primary" style="font-size:13px;padding:7px 16px" onclick="exportOrders()">匯出 CSV</button>
        <button onclick="showClearConfirm()" style="font-size:13px;padding:7px 16px;border:1.5px solid var(--red);color:var(--red);border-radius:20px;background:none;cursor:pointer;font-family:inherit">清除全部</button>
        <button onclick="toggleAdmin()" style="font-size:13px;padding:7px 16px;border:1.5px solid var(--border);color:var(--text-2);border-radius:20px;background:none;cursor:pointer;font-family:inherit">關閉</button>
      </div>
      <div class="inline-confirm" id="clear-confirm">
        <span>確定要清除所有訂單？此動作無法復原。</span>
        <div class="inline-confirm-btns">
          <button onclick="clearOrders()" style="padding:6px 14px;background:var(--red);color:#fff;border:none;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">確認清除</button>
          <button onclick="hideClearConfirm()" style="padding:6px 14px;border:1px solid var(--border);background:none;border-radius:16px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text-2)">取消</button>
        </div>
      </div>
      <div id="orders-list"><p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px">尚無訂單</p></div>
    </div>
  </div>
</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Sticky bar -->
<div class="sticky-bar">
  <div class="sticky-inner">
    <div class="sticky-totals">
      <div>已選 <strong><span id="total-items">0</span></strong> 件&ensp;|&ensp;合計 <strong>$<span id="total-amt">0</span></strong></div>
      <div class="sticky-sub" id="savings-txt"></div>
    </div>
    <button class="btn-primary" id="checkout-btn" onclick="openModal()" disabled>填寫訂購資料</button>
  </div>
</div>

<!-- Order modal -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <button class="close-btn" onclick="closeModal()">✕</button>

    <div id="order-form-view">
      <div class="modal-title">確認訂單</div>

      <!-- Summary -->
      <div class="order-summary-box">
        <div id="modal-summary-rows"></div>
        <div class="summary-total">
          <div class="summary-total-label">團購合計</div>
          <div class="summary-total-amt">$<span id="modal-total"></span></div>
        </div>
        <div class="summary-savings" id="modal-savings"></div>
      </div>

      <!-- Form -->
      <div class="form-group">
        <label class="form-label">姓名 *</label>
        <input class="form-input" id="f-name" placeholder="您的姓名" />
      </div>
      <div class="form-group">
        <label class="form-label">手機</label>
        <input class="form-input" id="f-phone" placeholder="09XXXXXXXX（選填）" inputmode="tel" />
      </div>
      <div class="form-group">
        <label class="form-label">LINE ID</label>
        <input class="form-input" id="f-line" placeholder="選填" />
      </div>
      <div class="form-group">
        <label class="form-label">備註</label>
        <input class="form-input" id="f-note" placeholder="如有特殊需求請填寫" />
      </div>
      <div class="form-group">
        <label class="form-label">付款方式 *</label>

/* ── Category switching ── */
function switchCat(id) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.catId === id));
  document.querySelectorAll('.cat-section').forEach(s => s.classList.toggle('visible', s.id === 'sec-' + id));
  // scroll tab into view
  const activeTab = document.querySelector('.cat-tab.active');
  if (activeTab) activeTab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

/* ── Cart logic ── */
function findProduct(id) {
  for (const cat of CATEGORIES) {
    const p = cat.products.find(p => p.id === id);
    if (p) return p;
  }
}

function changeQty(id, delta) {
  const cur = cart[id] || 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) delete cart[id]; else cart[id] = next;

  const qtyEl   = document.getElementById('qty-' + id);
  const minusBtn = document.querySelector(`#row-${id} .qty-btn.minus`);
  if (qtyEl) qtyEl.textContent = next;
  if (minusBtn) minusBtn.disabled = next === 0;

  updateTotals();
}

// retail 欄位 = 原零售價；員購價 = 原價 × 0.6（6折）
function groupPrice(p) { return Math.round(p.retail * 0.6); }
function retailOriginal(p) { return p.retail; }

function calcTotals() {
  let items = 0, total = 0;
  for (const [id, qty] of Object.entries(cart)) {
    const p = findProduct(+id);
    if (!p) continue;
    items += qty;
    total += groupPrice(p) * qty;
  }
  return { items, total };
}

function updateTotals() {
  const { items, total } = calcTotals();
  document.getElementById('total-items').textContent = items;
  document.getElementById('total-amt').textContent   = total.toLocaleString();
  document.getElementById('cart-count').textContent  = items;
  document.getElementById('savings-txt').textContent = '';
  document.getElementById('checkout-btn').disabled   = items === 0;
}

/* ── Modal ── */
function openModal() {
  const { total } = calcTotals();
  const rowsEl = document.getElementById('modal-summary-rows');
  rowsEl.innerHTML = '';
  for (const [id, qty] of Object.entries(cart)) {
    const p = findProduct(+id);
    if (!p) continue;
    const div = document.createElement('div');
    div.className = 'summary-row';
    div.innerHTML = `<span>${p.name} ×${qty}</span><span>$${(groupPrice(p) * qty).toLocaleString()}</span>`;
    rowsEl.appendChild(div);
  }
  document.getElementById('modal-total').textContent   = total.toLocaleString();
  document.getElementById('modal-savings').textContent = '';
  document.getElementById('order-form-view').style.display = 'block';
  document.getElementById('confirm-box').classList.remove('show');
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function selectPay(btn) {
  document.querySelectorAll('.pay-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPay = btn.dataset.pay;
}

/* ── Submit ── */
async function submitOrder() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  clearFieldError('f-name');
  if (!name)  { showFieldError('f-name', '請填寫姓名'); return; }
  if (!selectedPay) { showToast('請選擇付款方式', 'error'); return; }

  const { total } = calcTotals();
  const lineId = document.getElementById('f-line').value.trim();
  const note   = document.getElementById('f-note').value.trim();

  // Build LINE text
  let lines = ['✨ 理膚寶水 09月親友員購訂單 ✨', ''];
  lines.push(`姓名：${name}`);
  if (phone) lines.push(`手機：${phone}`);
  if (lineId) lines.push(`LINE：${lineId}`);
  lines.push(`付款：${selectedPay}`);
  if (note) lines.push(`備註：${note}`);
  lines.push('');
  lines.push('── 訂購明細 ──');
  for (const [id, qty] of Object.entries(cart)) {
    const p = findProduct(+id);
    if (!p) continue;
    lines.push(`• ${p.name} ×${qty}  $${(groupPrice(p) * qty).toLocaleString()}`);
  }
  lines.push('');
  lines.push(`訂單總額：$${total.toLocaleString()}`);

  const orderText = lines.join('\n');

  // Disable submit button while saving
  const submitBtn = document.querySelector('#order-form-view .btn-primary[onclick="submitOrder()"]');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '送出中…'; }

  try {
    const orderData = {
      name, phone, lineId, note, pay: selectedPay,
      items: Object.entries(cart).map(([id, qty]) => {
        const p = findProduct(+id);
        return { name: p.name, qty, price: groupPrice(p) };
      }),
      total,
      ts: new Date().toLocaleString('zh-TW'),
      paid: false
    };

    const res = await fetch(`${DB}/orders.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    document.getElementById('line-text').textContent = orderText;
    document.getElementById('order-form-view').style.display = 'none';
    document.getElementById('confirm-box').classList.add('show');
  } catch(e) {
    showToast('送出失敗，請稍後再試', 'error');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '送出訂單'; }
  }
}

/* ── Toast ── */
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function copyText() {
  const text = document.getElementById('line-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast('已複製！', 'ok');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已複製！', 'ok');
  });
}

/* ── Submit — inline validation messages ── */
function showFieldError(id, msg) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--red)';
  let err = el.nextElementSibling;
  if (!err || !err.classList.contains('field-err')) {
    err = document.createElement('div');
    err.className = 'field-err';
    err.style.cssText = 'font-size:12px;color:var(--red);margin-top:4px';
    el.after(err);
  }
  err.textContent = msg;
  el.focus();
}
function clearFieldError(id) {
  const el = document.getElementById(id);
  el.style.borderColor = '';
  const err = el.nextElementSibling;
  if (err && err.classList.contains('field-err')) err.remove();
}

/* ── Admin ── */
let adminUnlocked = false;

function toggleAdmin() {
  const panel = document.getElementById('admin-panel');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    return;
  }
  if (!adminUnlocked) {
    const pwBox = document.getElementById('admin-pw-box');
    pwBox.classList.add('show');
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('admin-pw-err').classList.remove('show');
    setTimeout(() => document.getElementById('admin-pw-input').focus(), 50);
  } else {
    panel.classList.add('open');
    renderOrders();
  }
}

function checkAdminPw() {
  const val = document.getElementById('admin-pw-input').value;
  const errEl = document.getElementById('admin-pw-err');
  if (val === '0000') {
    adminUnlocked = true;
    document.getElementById('admin-pw-box').classList.remove('show');
    document.getElementById('admin-panel').classList.add('open');
    renderOrders();
  } else {
    errEl.classList.add('show');
    document.getElementById('admin-pw-input').value = '';
    document.getElementById('admin-pw-input').focus();
  }
}

function closePwBox() {
  document.getElementById('admin-pw-box').classList.remove('show');
}

function showClearConfirm() {
  document.getElementById('clear-confirm').classList.add('show');
}
function hideClearConfirm() {
  document.getElementById('clear-confirm').classList.remove('show');
}

/* ── Admin — fetch from Firebase then render ── */
async function renderOrders() {
  const listEl = document.getElementById('orders-list');
  listEl.innerHTML = '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px">載入中…</p>';
  try {
    const res = await fetch(`${DB}/orders.json`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentOrders = data || {};
  } catch(e) {
    listEl.innerHTML = '<p style="color:var(--red);font-size:13px;text-align:center;padding:20px">載入失敗，請重試</p>';
    return;
  }
  renderOrdersFromData();
}

function renderOrdersFromData() {
  const listEl = document.getElementById('orders-list');
  const orders = Object.entries(currentOrders).map(([key, o]) => ({ ...o, fbKey: key }));
  // Firebase push IDs are lexicographically time-ordered — reverse for newest first
  orders.sort((a, b) => b.fbKey.localeCompare(a.fbKey));

  const totalAmt    = orders.reduce((s, o) => s + o.total, 0);
  const paidAmt     = orders.filter(o => o.paid).reduce((s, o) => s + o.total, 0);
  const unpaidAmt   = totalAmt - paidAmt;
  const paidCount   = orders.filter(o => o.paid).length;
  const unpaidCount = orders.length - paidCount;

  document.getElementById('admin-total-txt').textContent =
    `共 ${orders.length} 筆 / 合計 $${totalAmt.toLocaleString()}`;

  // Summary bar
  let summaryEl = document.getElementById('admin-summary');
  if (!summaryEl) {
    summaryEl = document.createElement('div');
    summaryEl.id = 'admin-summary';
    summaryEl.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px';
    listEl.before(summaryEl);
  }
  summaryEl.innerHTML = `
    <div style="background:var(--teal-lt);border:1px solid var(--teal);border-radius:8px;padding:12px;text-align:center">
      <div style="font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.06em;margin-bottom:4px">已收款（${paidCount} 筆）</div>
      <div style="font-size:20px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums">$${paidAmt.toLocaleString()}</div>
    </div>
    <div style="background:var(--badge-bg);border:1px solid #E8C87A;border-radius:8px;padding:12px;text-align:center">
      <div style="font-size:11px;color:var(--badge-txt);font-weight:700;letter-spacing:.06em;margin-bottom:4px">待收款（${unpaidCount} 筆）</div>
      <div style="font-size:20px;font-weight:700;color:var(--badge-txt);font-variant-numeric:tabular-nums">$${unpaidAmt.toLocaleString()}</div>
    </div>`;

  if (!orders.length) {
    listEl.innerHTML = '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px">尚無訂單</p>';
    return;
  }
  listEl.innerHTML = '';
  orders.forEach(o => {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.style.borderLeft = o.paid ? '4px solid var(--teal)' : '4px solid #E8C87A';
    const itemsText = o.items.map(i => `${i.name} ×${i.qty}`).join('、');
    const paidLabel = o.paid
      ? `<span style="background:var(--teal-lt);color:var(--teal);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--teal)">✓ 已收款</span>`
      : `<span style="background:var(--badge-bg);color:var(--badge-txt);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #E8C87A">待收款</span>`;
    const btnLabel = o.paid ? '標記待收款' : '✓ 標記已收款';
    const btnStyle = o.paid
      ? 'border:1px solid var(--border);color:var(--text-3);background:none'
      : 'border:1px solid var(--teal);color:var(--teal);background:none';
    const fbKey = o.fbKey;
    card.innerHTML = `
      <div class="order-card-header" style="align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="order-name">${o.name}</span>${paidLabel}
          </div>
          <div class="order-meta">${o.phone}${o.lineId ? ' · LINE: '+o.lineId : ''} · ${o.pay} · ${o.ts}</div>
        </div>
        <div style="text-align:right;flex:0 0 auto">
          <div class="order-amt">$${o.total.toLocaleString()}</div>
        </div>
      </div>
      <div class="order-items" style="margin-bottom:10px">${itemsText}</div>
      ${o.note ? `<div style="font-size:12px;color:var(--text-3);margin-bottom:8px">備註：${o.note}</div>` : ''}
      <div style="display:flex;gap:8px;align-items:center">
        <button data-fbkey="${fbKey}" onclick="togglePaid(this.dataset.fbkey)" style="font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;cursor:pointer;font-family:inherit;${btnStyle}">${btnLabel}</button>
        <button data-fbkey="${fbKey}" onclick="deleteOrder(this.dataset.fbkey)" style="font-size:12px;padding:5px 10px;border-radius:14px;cursor:pointer;font-family:inherit;border:1px solid var(--red);color:var(--red);background:none">刪除</button>
      </div>`;
    listEl.appendChild(card);
  });
}

async function togglePaid(fbKey) {
  const order = currentOrders[fbKey];
  if (!order) return;
  const newPaid = !order.paid;
  try {
    const res = await fetch(`${DB}/orders/${fbKey}.json`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paid: newPaid })
    });
    if (!res.ok) throw new Error();
    currentOrders[fbKey].paid = newPaid;
    renderOrdersFromData();
  } catch(e) {
    showToast('操作失敗', 'error');
  }
}

async function deleteOrder(fbKey) {
  try {
    const res = await fetch(`${DB}/orders/${fbKey}.json`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    delete currentOrders[fbKey];
    renderOrdersFromData();
    showToast('訂單已刪除');
  } catch(e) {
    showToast('刪除失敗', 'error');
  }
}

async function clearOrders() {
  try {
    const res = await fetch(`${DB}/orders.json`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    currentOrders = {};
    hideClearConfirm();
    renderOrdersFromData();
    showToast('已清除所有訂單', 'ok');
  } catch(e) {
    showToast('清除失敗', 'error');
  }
}

async function exportOrders() {
  // Use cached data if available, else fetch fresh
  if (!Object.keys(currentOrders).length) {
    try {
      const res = await fetch(`${DB}/orders.json`);
      const data = await res.json();
      currentOrders = data || {};
    } catch(e) {
      showToast('匯出失敗', 'error');
      return;
    }
  }
  const orders = Object.values(currentOrders);
  if (!orders.length) { showToast('目前沒有訂單', 'error'); return; }
  const rows = [['姓名','手機','LINE','付款','訂單金額','商品','備註','時間','收款狀態']];
  orders.forEach(o => {
    rows.push([
      o.name, o.phone, o.lineId, o.pay, o.total,
      o.items.map(i => `${i.name}×${i.qty}`).join(' / '),
      o.note, o.ts, o.paid ? '已收款' : '待收款'
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '理膚寶水員購訂單.csv'; a.click();
  URL.revokeObjectURL(url);
}

// init
updateTotals();
</script>
